<!DOCTYPE html>
<html><head><title>Legacy Cloud — Admin</title>
<style>
body{background:#000;color:#fff;font-family:Consolas,monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden;position:relative;}
.card{background:#0a0a0a;border:1px solid #fff;padding:44px;text-align:center;position:relative;z-index:2;
  animation:cardIn 0.6s cubic-bezier(.2,.8,.2,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
h1{animation:flicker 3s infinite;}
@keyframes flicker{0%,100%{opacity:1;}92%{opacity:1;}93%{opacity:0.4;}94%{opacity:1;}}
a.btn{background:#fff;color:#000;padding:14px 28px;text-decoration:none;font-weight:800;display:inline-block;margin-top:22px;letter-spacing:1px;transition:all .2s;}
a.btn:hover{background:#ccc;transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,255,255,0.15);}
canvas{position:absolute;top:0;left:0;z-index:1;}
</style></head>
<body>
<canvas id="bg"></canvas>
<div class="card"><h1>LEGACY CLOUD</h1><p style="color:#888;margin-top:6px;">// ADMIN ACCESS ONLY</p>
<a class="btn" href="/discord-login">LOGIN WITH DISCORD</a>

<div style="margin-top:24px; padding-top:24px; border-top:1px solid #333;">
    <p style="color:#666; font-size:12px; margin-bottom:14px;">OR LOGIN WITH EMAIL</p>
    <form method="post" action="/login-email">
        <input name="email" type="email" placeholder="Email" required
               style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff;">
        <input name="password" type="password" placeholder="Password" required
               style="width:100%; padding:10px; margin-bottom:14px; background:#000; border:1px solid #333; color:#fff;">
        <button type="submit" style="width:100%; padding:12px; background:#fff; color:#000; border:none; font-weight:800; cursor:pointer;">
            LOGIN
        </button>
    </form>
</div>
</div>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
const chars='01アイウエオカキク';
const cols=Math.floor(c.width/16);const drops=Array(cols).fill(0);
function draw(){
  x.fillStyle='rgba(0,0,0,0.08)';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='rgba(255,255,255,0.35)';x.font='14px monospace';
  drops.forEach((y,i)=>{
    x.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,y);
    if(y>c.height && Math.random()>0.975) drops[i]=0; else drops[i]=y+16;
  });
}
setInterval(draw,50);
</script>
</body></html>
